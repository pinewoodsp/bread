<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 귀여운 빵 만들기 게임</title>
    <style>
        body {
            background-color: #faf5eb;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            box-sizing: border-box;
            padding: 20px;
        }
        .active { display: block; }
        
        h1 { text-align: center; color: #4a3525; margin-top: 10px; font-size: 24px; }
        
        .ingredients-grid { display: flex; gap: 20px; margin-top: 20px; height: 420px; }
        .ingredients-list { display: grid; grid-template-columns: repeat(2, 110px); gap: 15px; width: 240px; }
        
        .ingredient { 
            width: 100px; 
            height: 100px; 
            border: 3px solid #ddd; 
            cursor: pointer; 
            border-radius: 10px; 
            position: relative; 
            overflow: hidden;
            box-sizing: border-box;
            background-color: #fff;
        }
        .ingredient img { 
            width: 100%; 
            height: 100%; 
            border-radius: 6px; 
            object-fit: contain;
            display: block;
        }
        .ingredient.checked { border-color: #2ecc71; }
        .ingredient.checked::after { 
            content: "✓"; 
            position: absolute; 
            top: 5px; 
            right: 5px; 
            background: #2ecc71; 
            color: white; 
            border-radius: 50%; 
            width: 20px; 
            height: 20px; 
            text-align: center; 
            line-height: 20px; 
            font-weight: bold; 
            font-size: 14px;
        }
        
        #bowl-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        #bowl-area img { width: 280px; object-fit: contain; }
        #note-img { position: absolute; right: 20px; top: 20px; width: 140px; object-fit: contain; }
        .next-btn { position: absolute; bottom: 30px; right: 30px; padding: 15px 30px; background: #e67e22; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; display: none; }
        
        .choice-container { display: flex; justify-content: center; gap: 50px; margin-top: 50px; }
        .choice-btn { padding: 25px 50px; font-size: 22px; color: white; border: none; border-radius: 15px; cursor: pointer; transition: transform 0.2s; }
        #btn-baguette { background: #d35400; }
        #btn-bread { background: #b37d4e; }
        .choice-btn:hover { transform: scale(1.05); }
        #kneading-img { display: block; margin: 20px auto; width: 180px; object-fit: contain; }
        #rolling-pin-img { display: block; margin: 0 auto; width: 120px; object-fit: contain; }

        #timing-track { width: 500px; height: 40px; background: #ddd; margin: 100px auto 20px; border-radius: 20px; position: relative; }
        #target-zone { height: 100%; background: #2ecc71; position: absolute; border-radius: 5px; }
        #timing-bar { width: 8px; height: 50px; background: #f1c40f; position: absolute; top: -5px; border-radius: 4px; }
        .game-info { text-align: center; font-size: 20px; color: #555; margin-top: 20px; }

        #oven-area { text-align: center; margin-top: 30px; position: relative; height: 250px; }
        #oven-area img { width: 280px; display: none; margin: 0 auto; object-fit: contain; }
        #oven-area img.active-oven { display: block; }
        #gauge-container { width: 500px; height: 30px; background: #ddd; margin: 30px auto; border-radius: 15px; position: relative; overflow: hidden; border: 2px solid #333; }
        #gauge-bar { height: 100%; width: 30%; background: #3498db; transition: width 0.1s ease, background-color 0.3s; }
        .guide-lines { position: absolute; width: 100%; height: 100%; top: 0; pointer-events: none; }
        .line-40 { position: absolute; left: 40%; width: 2px; height: 100%; background: black; }
        .line-75 { position: absolute; left: 75%; width: 2px; height: 100%; background: black; }
        #heat-btn { display: block; margin: 0 auto; padding: 15px 40px; font-size: 20px; background: #e74c3c; color: white; border: none; border-radius: 10px; cursor: pointer; }
        #timer-display { text-align: center; font-size: 24px; color: red; font-weight: bold; }

        #result-area { text-align: center; margin-top: 50px; }
        #result-img { width: 300px; border-radius: 15px; object-fit: contain; }
        #result-text { font-size: 26px; font-weight: bold; margin: 20px 0; color: #2c3e50; }
        #restart-btn { padding: 12px 30px; font-size: 18px; background: #7f8c8d; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="screen-ingredients" class="screen active">
        <h1>레시피대로 재료를 터치해 넣으세요!</h1>
        <img id="note-img" src="note.png" alt="레시피 노트">
        <div class="ingredients-grid">
            <div class="ingredients-list">
                <div class="ingredient" onclick="clickIngredient('flour')"><img src="flour.png"></div>
                <div class="ingredient" onclick="clickIngredient('salt')"><img src="salt.png"></div>
                <div class="ingredient" onclick="clickIngredient('sugar')"><img src="sugar.png"></div>
                <div class="ingredient" onclick="clickIngredient('yeast')"><img src="yeast.png"></div>
                <div class="ingredient" onclick="clickIngredient('water')"><img src="water.png"></div>
            </div>
            <div id="bowl-area">
                <img src="bowl.png" alt="믹싱볼">
            </div>
        </div>
        <button class="next-btn" id="to-shape-btn" onclick="changeScreen('screen-choose-shape')">구우러 가기 →</button>
    </div>

    <div id="screen-choose-shape" class="screen">
        <h1>어떤 모양의 빵을 만드시겠습니까?</h1>
        <img id="kneading-img" src="kneading.png">
        <img id="rolling-pin-img" src="rolling_pin.png">
        <div class="choice-container">
            <button class="choice-btn" id="btn-baguette" onclick="chooseShape('baguette')">바게트 모양</button>
            <button class="choice-btn" id="btn-bread" onclick="chooseShape('bread')">식빵 모양</button>
        </div>
    </div>

    <div id="screen-timing" class="screen" onclick="triggerTiming()">
        <h1>밀대로 반죽 밀기! (초록색 칸에서 화면 클릭)</h1>
        <div id="timing-track">
            <div id="target-zone"></div>
            <div id="timing-bar"></div>
        </div>
        <div class="game-info" id="timing-info">남은 기회: 3번 | 성공: 0번</div>
    </div>

    <div id="screen-oven" class="screen">
        <div id="timer-display">남은 시간: 5초</div>
        <h1>마우스 클릭이나 스페이스바를 연타하세요!</h1>
        <div id="oven-area">
            <img id="oven-off" src="oven_off.png" class="active-oven">
            <img id="oven-on" src="oven_on.png">
        </div>
        <div id="gauge-container">
            <div id="gauge-bar"></div>
            <div class="guide-lines">
                <div class="line-40"></div>
                <div class="line-75"></div>
            </div>
        </div>
        <div class="game-info" style="margin-top:-15px; margin-bottom:15px;">← 덜구워짐 [ 완벽함 존! ✨ ] 타버림 →</div>
        <button id="heat-btn" onmousedown="heatOven()">연타!!!</button>
    </div>

    <div id="screen-result" class="screen">
        <h1>베이킹 결과</h1>
        <div id="result-area">
            <img id="result-img" src="" alt="최종 빵">
            <div id="result-text">결과 메시지</div>
            <button id="restart-btn" onclick="resetGame()">다시 만들기</button>
        </div>
    </div>
</div>

<script>
    let ingredientsStatus = { flour: false, salt: false, sugar: false, yeast: false, water: false };
    let selectedBread = '';
    
    let timingAttempts = 3;
    let timingSuccesses = 0;
    let barPosition = 0;
    let barDirection = 1;
    let barSpeed = 5;
    let targetX = 200;
    let targetWidth = 80;
    let timingInterval;

    let ovenGauge = 30;
    let ovenTimeLeft = 50; 
    let ovenInterval;
    let isOvenActive = false;

    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        if (screenId === 'screen-timing') startTimingGame();
        if (screenId === 'screen-oven') startOvenGame();
    }

    function clickIngredient(name) {
        ingredientsStatus[name] = true;
        const elements = document.querySelectorAll('.ingredient');
        const index = ['flour', 'salt', 'sugar', 'yeast', 'water'].indexOf(name);
        elements[index].classList.add('checked');

        if (Object.values(ingredientsStatus).every(v => v === true)) {
            document.getElementById('to-shape-btn').style.display = 'block';
        }
    }

    function chooseShape(type) {
        selectedBread = type;
        changeScreen('screen-timing');
    }

    function startTimingGame() {
        timingAttempts = 3;
        timingSuccesses = 0;
        repositionTarget();
        updateTimingUI();
        
        timingInterval = setInterval(() => {
            barPosition += barSpeed * barDirection;
            if (barPosition <= 0 || barPosition >= 492) barDirection *= -1; 
            document.getElementById('timing-bar').style.left = barPosition + 'px';
        }, 10);
    }

    function repositionTarget() {
        targetX = Math.floor(Math.random() * 300) + 50; 
        const targetZone = document.getElementById('target-zone');
        targetZone.style.left = targetX + 'px';
        targetZone.style.width = targetWidth + 'px';
    }

    function updateTimingUI() {
        document.getElementById('timing-info').innerText = `남은 기회: ${timingAttempts}번 | 성공: ${timingSuccesses}번`;
    }

    function triggerTiming() {
        if (barPosition >= targetX && barPosition <= (targetX + targetWidth)) {
            timingSuccesses++;
        }
        timingAttempts--;
        updateTimingUI();
        repositionTarget();

        if (timingAttempts <= 0) {
            clearInterval(timingInterval);
            ovenGauge = 20 + (timingSuccesses * 10); 
            changeScreen('screen-oven');
        }
    }

    function startOvenGame() {
        isOvenActive = true;
        ovenTimeLeft = 50;
        
        window.addEventListener('keydown', handleSpaceKey);

        ovenInterval = setInterval(() => {
            ovenTimeLeft--;
            if (ovenGauge > 0) ovenGauge -= 0.6;
            if (ovenGauge < 0) ovenGauge = 0;
            
            updateOvenUI();

            if (ovenTimeLeft <= 0) {
                endOvenGame();
            }
        }, 100);
    }

    function handleSpaceKey(e) {
        if (e.code === "Space" && isOvenActive) {
            e.preventDefault();
            heatOven();
        }
    }

    function heatOven() {
        if (!isOvenActive) return;
        ovenGauge += 4;
        if (ovenGauge > 100) ovenGauge = 100;
        
        document.getElementById('oven-off').classList.remove('active-oven');
        document.getElementById('oven-on').classList.add('active-oven');
        
        setTimeout(() => {
            if(!isOvenActive) return;
            document.getElementById('oven-on').classList.remove('active-oven');
            document.getElementById('oven-off').classList.add('active-oven');
        }, 80);
    }

    function updateOvenUI() {
        document.getElementById('timer-display').innerText = `남은 시간: ${(ovenTimeLeft/10).toFixed(1)}초`;
        const gaugeBar = document.getElementById('gauge-bar');
        gaugeBar.style.width = ovenGauge + '%';

        if (ovenGauge < 40) gaugeBar.style.backgroundColor = '#3498db';
        else if (ovenGauge <= 75) gaugeBar.style.backgroundColor = '#2ecc71';
        else gaugeBar.style.backgroundColor = '#e74c3c';
    }

    function endOvenGame() {
        isOvenActive = false;
        clearInterval(ovenInterval);
        window.removeEventListener('keydown', handleSpaceKey);

        let state = 2;
        if (ovenGauge < 40) state = 1;
        else if (ovenGauge > 75) state = 3;

        showResult(state);
    }

    function showResult(state) {
        changeScreen('screen-result');
        const resultImg = document.getElementById('result-img');
        const resultText = document.getElementById('result-text');

        let fileName = "";
        let message = "";

        if (selectedBread === 'baguette') {
            if (state === 1) { fileName = "baguette1.png"; message = "앗... 덜 익어서 딱딱해요 😭"; }
            else if (state === 2) { fileName = "baguette2.png"; message = "겉바속촉 완벽한 황금빛 바게트 완성! ✨"; }
            else { fileName = "baguette3.png"; message = "새까맣게 타버린 숯댕이 바게트입니다... 🖤"; }
        } else {
            if (state === 1) { fileName = "bread1.png"; message = "밀가루 맛이 그대로 나는 덜 구워진 식빵 😭"; }
            else if (state === 2) { fileName = "bread2.png"; message = "폭신폭신 갓 구워진 최고의 우유식빵! ✨"; }
            else { fileName = "bread3.png"; message = "형체를 알아볼 수 없이 타버린 식빵입니다 🖤"; }
        }

        resultImg.src = fileName;
        resultText.innerText = message;
    }

    function resetGame() {
        ingredientsStatus = { flour: false, salt: false, sugar: false, yeast: false, water: false };
        selectedBread = '';
        document.querySelectorAll('.ingredient').forEach(el => el.classList.remove('checked'));
        document.getElementById('to-shape-btn').style.display = 'none';
        
        document.getElementById('oven-on').classList.remove('active-oven');
        document.getElementById('oven-off').classList.add('active-oven');

        changeScreen('screen-ingredients');
    }
</script>
</body>
</html>
