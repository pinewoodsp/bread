<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍞 빵 만들기 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        /* ===== 공통 화면 ===== */
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        /* ===== 타이머 ===== */
        .timer {
            position: fixed;
            top: 20px;
            left: 28px;
            background: rgba(255,255,255,0.85);
            color: #5d4037;
            border-radius: 20px;
            padding: 6px 20px;
            font-size: 1.3rem;
            letter-spacing: 2px;
            font-weight: bold;
            border: 2px solid #deb887;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
            z-index: 100;
        }

        /* ===== 화면 1: 재료 준비 ===== */
        #screen-ingredients {
            justify-content: flex-end;
            padding-bottom: 48px;
        }

        .ingredients-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #5d4037;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.75);
            padding: 6px 24px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .counter {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            padding: 18px 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 18px;
            border: 2px solid rgba(222,184,135,0.5);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .ingredient-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s;
            user-select: none;
            position: relative;
        }

        .ingredient-item:active { transform: scale(0.90); }

        .ingredient-item .icon {
            font-size: 2.8rem;
            transition: filter 0.3s, transform 0.2s;
        }

        .ingredient-item.added .icon {
            filter: grayscale(0.8) opacity(0.45);
        }

        .ingredient-item span {
            font-size: 0.85rem;
            color: #7a5230;
            margin-top: 4px;
            font-weight: bold;
        }

        .check {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #4caf50;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ingredient-item.added .check { opacity: 1; }

        /* 그릇 */
        .bowl-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .bowl {
            font-size: 6rem;
            transition: transform 0.3s;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .bowl.shake {
            animation: bowlShake 0.45s ease;
        }

        @keyframes bowlShake {
            0%   { transform: rotate(0deg) scale(1); }
            20%  { transform: rotate(-8deg) scale(1.10); }
            40%  { transform: rotate(8deg) scale(1.10); }
            60%  { transform: rotate(-5deg) scale(1.05); }
            80%  { transform: rotate(3deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* 소금 파티클 */
        .salt-particle {
            position: fixed;
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: saltFall 0.75s ease-out forwards;
            box-shadow: 0 0 3px rgba(0,0,0,0.18);
            z-index: 200;
        }

        @keyframes saltFall {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(70px) scale(0.2); }
        }

        /* 레시피 버튼 */
        .recipe-btn {
            position: fixed;
            top: 16px;
            right: 24px;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 100;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }
        .recipe-btn:hover { transform: scale(1.2) rotate(-5deg); }

        /* 레시피 카드 */
        .recipe-card {
            position: fixed;
            top: 60px;
            right: 20px;
            width: 210px;
            background: rgba(255,253,231,0.97);
            border: 2px solid #f9a825;
            border-radius: 14px;
            padding: 16px;
            font-size: 0.9rem;
            color: #5d4037;
            box-shadow: 4px 4px 14px rgba(0,0,0,0.14);
            display: none;
            z-index: 150;
        }

        .recipe-card.show { display: block; }
        .recipe-card h3 { color: #f57f17; margin-bottom: 10px; font-size: 1.05rem; }
        .recipe-card ol { padding-left: 18px; }
        .recipe-card li { margin-bottom: 6px; }
        .recipe-card li.done { color: #bbb; text-decoration: line-through; }

        /* 다음 버튼 */
        .next-btn {
            margin-top: 10px;
            padding: 13px 40px;
            background: linear-gradient(135deg, #f9a825, #f57f17);
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245,127,23,0.38);
            transition: transform 0.15s, box-shadow 0.15s;
            opacity: 0;
            pointer-events: none;
        }

        .next-btn.visible {
            opacity: 1;
            pointer-events: auto;
            animation: popIn 0.4s cubic-bezier(.36,.07,.19,.97);
        }

        .next-btn:hover { transform: scale(1.07); }

        @keyframes popIn {
            0%   { transform: scale(0.6); }
            70%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        /* ===== 화면 2: 반죽 ===== */
        #screen-mixing {
            justify-content: center;
            gap: 20px;
        }

        .game-panel {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            border: 2px solid rgba(222,184,135,0.5);
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            min-width: 360px;
        }

        .mixing-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a0522d;
        }

        .mixing-subtitle {
            font-size: 0.95rem;
            color: #888;
            text-align: center;
            margin-top: -10px;
        }

        .slider-container {
            width: 320px;
            height: 42px;
            background: #f5e6c8;
            border-radius: 21px;
            position: relative;
            overflow: hidden;
            border: 2px solid #deb887;
        }

        .slider-target {
            position: absolute;
            top: 0;
            height: 100%;
            background: rgba(76,175,80,0.32);
            border: 2px solid #4caf50;
            border-radius: 6px;
        }

        .slider-marker {
            position: absolute;
            top: 5px;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #f9a825, #f57f17);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.22);
        }

        .chances {
            font-size: 1.05rem;
            color: #f57f17;
            font-weight: bold;
        }

        .hit-feedback {
            font-size: 1.4rem;
            font-weight: bold;
            min-height: 34px;
            text-align: center;
        }

        .hit-feedback.hit  { color: #4caf50; }
        .hit-feedback.miss { color: #f44336; }

        .dough-display {
            font-size: 5.5rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
        }

        .dough-display.squish {
            animation: doughSquish 0.5s cubic-bezier(.36,.07,.19,.97);
        }

        @keyframes doughSquish {
            0%   { transform: scale(1,1); }
            20%  { transform: scale(1.32,0.68); }
            50%  { transform: scale(0.84,1.22); }
            75%  { transform: scale(1.1,0.92); }
            100% { transform: scale(1,1); }
        }

        .tap-btn {
            padding: 14px 52px;
            background: linear-gradient(135deg, #a5d6a7, #388e3c);
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56,142,60,0.35);
            transition: transform 0.1s;
            user-select: none;
        }
        .tap-btn:active { transform: scale(0.93); }

        /* ===== 화면 3: 오븐 ===== */
        #screen-oven { gap: 16px; }

        .oven-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a0522d;
        }

        .oven-display {
            font-size: 5.5rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
        }

        .oven-temp {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f44336;
        }

        .gauge-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 320px;
        }

        .gauge-bar {
            width: 100%;
            height: 30px;
            background: #f5e6c8;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #deb887;
            position: relative;
        }

        .gauge-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffeb3b, #ff9800, #f44336);
            border-radius: 15px;
            transition: width 0.25s ease;
        }

        .gauge-target-marker {
            position: absolute;
            top: 0;
            height: 100%;
            width: 4px;
            background: #4caf50;
        }

        .gauge-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.8rem;
            color: #888;
        }

        .smash-btn {
            padding: 14px 52px;
            background: linear-gradient(135deg, #ef9a9a, #c62828);
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(198,40,40,0.35);
            transition: transform 0.1s;
            user-select: none;
        }
        .smash-btn:active { transform: scale(0.93); }

        .oven-feedback {
            font-size: 1rem;
            color: #5d4037;
            font-weight: bold;
            min-height: 24px;
            background: rgba(255,255,255,0.7);
            padding: 4px 18px;
            border-radius: 12px;
        }

        /* ===== 화면 4: 완성 ===== */
        #screen-result { gap: 18px; }

        .result-bread {
            font-size: 8rem;
            animation: breadFloat 2s ease-in-out infinite;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
        }

        @keyframes breadFloat {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }

        .result-title {
            font-size: 2rem;
            font-weight: bold;
            color: #f57f17;
            text-align: center;
            background: rgba(255,255,255,0.80);
            padding: 8px 28px;
            border-radius: 20px;
        }

        .stars { font-size: 2.2rem; letter-spacing: 8px; }

        .result-subtitle {
            font-size: 1.05rem;
            color: #7a5230;
            text-align: center;
            background: rgba(255,255,255,0.70);
            padding: 4px 18px;
            border-radius: 12px;
        }

        .retry-btn {
            padding: 13px 40px;
            background: linear-gradient(135deg, #f9a825, #f57f17);
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245,127,23,0.38);
            transition: transform 0.15s;
        }
        .retry-btn:hover { transform: scale(1.07); }

        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 1.6rem;
            animation: sparklePop 1s ease-out forwards;
            z-index: 200;
        }

        @keyframes sparklePop {
            0%   { opacity: 1; transform: scale(0) translateY(0); }
            50%  { opacity: 1; transform: scale(1.3) translateY(-30px); }
            100% { opacity: 0; transform: scale(0.5) translateY(-70px); }
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.72);
            color: white;
            padding: 10px 26px;
            border-radius: 22px;
            font-size: 0.98rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 300;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ===== 화면 1: 재료 준비 ===== -->
<div class="screen active" id="screen-ingredients">
    <div class="timer" id="timer1">00:00</div>
    <div class="recipe-btn" id="recipeBtn">📋</div>
    <div class="recipe-card" id="recipeCard">
        <h3>🍞 레시피</h3>
        <ol id="recipeList">
            <li id="r-flour">밀가루</li>
            <li id="r-salt">소금</li>
            <li id="r-sugar">설탕</li>
            <li id="r-water">물</li>
            <li id="r-yeast">이스트</li>
        </ol>
    </div>

    <div class="ingredients-title">재료를 반죽에 넣어요!</div>

    <div class="bowl-area">
        <div class="bowl" id="bowl">🥣</div>
    </div>

    <div class="counter">
        <div class="ingredient-item" id="ing-flour" onclick="addIngredient('flour', event)">
            <div class="icon">🌾</div>
            <span>밀가루</span>
            <div class="check">✓</div>
        </div>
        <div class="ingredient-item" id="ing-salt" onclick="addIngredient('salt', event)">
            <div class="icon">🧂</div>
            <span>소금</span>
            <div class="check">✓</div>
        </div>
        <div class="ingredient-item" id="ing-sugar" onclick="addIngredient('sugar', event)">
            <div class="icon">🍬</div>
            <span>설탕</span>
            <div class="check">✓</div>
        </div>
        <div class="ingredient-item" id="ing-water" onclick="addIngredient('water', event)">
            <div class="icon">💧</div>
            <span>물</span>
            <div class="check">✓</div>
        </div>
        <div class="ingredient-item" id="ing-yeast" onclick="addIngredient('yeast', event)">
            <div class="icon">🫧</div>
            <span>이스트</span>
            <div class="check">✓</div>
        </div>
    </div>

    <button class="next-btn" id="nextBtn1" onclick="goToMixing()">반죽하러 가기 →</button>
</div>

<!-- ===== 화면 2: 반죽 ===== -->
<div class="screen" id="screen-mixing">
    <div class="timer" id="timer2">00:00</div>
    <div class="game-panel">
        <div class="mixing-title">반죽 미니게임!</div>
        <div class="mixing-subtitle">초록 칸에 맞춰서 탭하세요 (3번 기회)</div>
        <div class="dough-display" id="doughDisplay">🫓</div>
        <div class="slider-container" id="sliderContainer">
            <div class="slider-target" id="sliderTarget"></div>
            <div class="slider-marker" id="sliderMarker"></div>
        </div>
        <div class="chances" id="chancesDisplay">기회: ❤️❤️❤️</div>
        <div class="hit-feedback" id="hitFeedback"></div>
        <button class="tap-btn" id="tapBtn" onclick="tapSlider()">탭!</button>
    </div>
</div>

<!-- ===== 화면 3: 오븐 ===== -->
<div class="screen" id="screen-oven">
    <div class="timer" id="timer3">00:00</div>
    <div class="game-panel">
        <div class="oven-title">🔥 오븐에 굽기!</div>
        <div class="oven-display" id="ovenDisplay">🍞</div>
        <div class="oven-temp" id="ovenTemp">0°C / 목표: 180°C</div>
        <div class="gauge-wrap">
            <div class="gauge-bar">
                <div class="gauge-fill" id="gaugeFill"></div>
                <div class="gauge-target-marker" id="gaugeTarget"></div>
            </div>
            <div class="gauge-labels">
                <span>0°C</span>
                <span>100°C</span>
                <span>200°C</span>
                <span>300°C</span>
            </div>
        </div>
        <div class="oven-feedback" id="ovenFeedback">버튼을 연타해서 온도를 올려요!</div>
        <button class="smash-btn" id="smashBtn" onclick="smashOven()">🔥 가열!</button>
    </div>
</div>

<!-- ===== 화면 4: 완성 ===== -->
<div class="screen" id="screen-result">
    <div class="result-bread" id="resultBread">🍞</div>
    <div class="result-title" id="resultTitle">완벽한 빵이야!! 🎉</div>
    <div class="stars" id="resultStars">⭐⭐⭐</div>
    <div class="result-subtitle" id="resultSubtitle">최고의 빵을 구웠어요!</div>
    <button class="retry-btn" onclick="restartGame()">다시 하기 🔄</button>
</div>

<script>
let gameState = {
    screen: 1,
    ingredients: { flour:false, salt:false, sugar:false, water:false, yeast:false },
    score: 0,
    ovenTemp: 0,
    timerSec: 0,
    timerInterval: null,
};

const TARGET_TEMP   = 180;
const MAX_TEMP      = 300;
const TEMP_PER_TAP  = 8;
const TEMP_DECAY    = 0.5;
const PERFECT_RANGE = 15;
const TOTAL_HITS    = 3;

// 타이머
function startTimer(id) {
    if (gameState.timerInterval) clearInterval(gameState.timerInterval);
    gameState.timerSec = 0;
    gameState.timerInterval = setInterval(() => {
        gameState.timerSec++;
        const m = String(Math.floor(gameState.timerSec / 60)).padStart(2,'0');
        const s = String(gameState.timerSec % 60).padStart(2,'0');
        const el = document.getElementById(id);
        if (el) el.textContent = `${m}:${s}`;
    }, 1000);
}

// 토스트
function showToast(msg, duration=1500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
}

// 화면 전환
function goToScreen(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const ids = ['ingredients','mixing','oven','result'];
    document.getElementById(`screen-${ids[n-1]}`).classList.add('active');
    gameState.screen = n;
}

// ===== 화면 1 =====
startTimer('timer1');

document.getElementById('recipeBtn').addEventListener('click', () => {
    document.getElementById('recipeCard').classList.toggle('show');
});

function addIngredient(type, event) {
    if (gameState.ingredients[type]) return;
    gameState.ingredients[type] = true;

    document.getElementById(`ing-${type}`).classList.add('added');
    const rMap = { flour:'r-flour', salt:'r-salt', sugar:'r-sugar', water:'r-water', yeast:'r-yeast' };
    document.getElementById(rMap[type]).classList.add('done');

    if (type === 'salt') spawnSaltParticles(event);

    const bowl = document.getElementById('bowl');
    bowl.classList.remove('shake');
    void bowl.offsetWidth;
    bowl.classList.add('shake');
    setTimeout(() => bowl.classList.remove('shake'), 460);

    const allDone = Object.values(gameState.ingredients).every(v => v);
    if (allDone) {
        document.getElementById('nextBtn1').classList.add('visible');
        showToast('재료 준비 완료! 🎉');
    }
}

function spawnSaltParticles(event) {
    for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'salt-particle';
        p.style.left = (event.clientX + (Math.random()-0.5)*40) + 'px';
        p.style.top  = (event.clientY + (Math.random()-0.5)*20) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 850);
    }
}

function goToMixing() {
    goToScreen(2);
    startTimer('timer2');
    initMixing();
}

// ===== 화면 2 =====
let sliderX=0, sliderDir=1, sliderSpeed=2.8;
let targetLeft=0, targetWidth=0;
let chances=3, hitCount=0, sliderRAF=null;

function initMixing() {
    chances=3; hitCount=0; sliderX=0; sliderDir=1;
    gameState.score=0;
    updateChancesDisplay();
    randomTarget();
    requestAnimationFrame(animateSlider);
}

function randomTarget() {
    const W = document.getElementById('sliderContainer').offsetWidth;
    targetWidth = Math.floor(Math.random()*50)+60;
    targetLeft  = Math.floor(Math.random()*(W-targetWidth-32))+16;
    document.getElementById('sliderTarget').style.left  = targetLeft+'px';
    document.getElementById('sliderTarget').style.width = targetWidth+'px';
}

function animateSlider() {
    const W = document.getElementById('sliderContainer').offsetWidth - 32;
    sliderX += sliderDir * sliderSpeed;
    if (sliderX >= W) { sliderX=W; sliderDir=-1; }
    if (sliderX <= 0) { sliderX=0; sliderDir= 1; }
    document.getElementById('sliderMarker').style.left = sliderX+'px';
    sliderRAF = requestAnimationFrame(animateSlider);
}

function tapSlider() {
    if (chances<=0) return;
    const center = sliderX+16;
    const isHit  = center>=targetLeft && center<=targetLeft+targetWidth;
    const fb     = document.getElementById('hitFeedback');
    const dough  = document.getElementById('doughDisplay');

    if (isHit) {
        hitCount++; gameState.score++;
        fb.textContent='👍 좋아요!'; fb.className='hit-feedback hit';
        dough.classList.remove('squish');
        void dough.offsetWidth;
        dough.classList.add('squish');
        showToast('찰떡 타이밍! 👏');
        randomTarget();
        if (hitCount>=TOTAL_HITS) {
            cancelAnimationFrame(sliderRAF);
            fb.textContent='🎊 반죽 완성!';
            document.getElementById('tapBtn').disabled=true;
            setTimeout(() => { goToScreen(3); startTimer('timer3'); initOven(); }, 1200);
        }
    } else {
        chances--;
        updateChancesDisplay();
        fb.textContent='😅 미스!'; fb.className='hit-feedback miss';
        showToast('아깝다! 다시!');
        if (chances<=0) {
            cancelAnimationFrame(sliderRAF);
            fb.textContent='😢 다시 도전!';
            document.getElementById('tapBtn').disabled=true;
            setTimeout(() => {
                document.getElementById('tapBtn').disabled=false;
                hitCount=0; chances=3;
                updateChancesDisplay();
                randomTarget();
                requestAnimationFrame(animateSlider);
                fb.textContent='';
            }, 1500);
        }
    }
}

function updateChancesDisplay() {
    const h=['❤️','❤️','❤️'];
    for(let i=chances;i<3;i++) h[i]='🖤';
    document.getElementById('chancesDisplay').textContent='기회: '+h.join('');
}

// ===== 화면 3 =====
let ovenDecayInterval=null;

function initOven() {
    gameState.ovenTemp=0; updateGauge();
    document.getElementById('ovenFeedback').textContent='버튼을 연타해서 온도를 올려요!';
    document.getElementById('smashBtn').disabled=false;
    if(ovenDecayInterval) clearInterval(ovenDecayInterval);
    ovenDecayInterval=setInterval(()=>{
        if(gameState.ovenTemp>0){
            gameState.ovenTemp=Math.max(0,gameState.ovenTemp-TEMP_DECAY);
            updateGauge();
        }
    },100);
    const pct=(TARGET_TEMP/MAX_TEMP)*100;
    document.getElementById('gaugeTarget').style.left=pct+'%';
}

function smashOven() {
    gameState.ovenTemp=Math.min(MAX_TEMP,gameState.ovenTemp+TEMP_PER_TAP);
    updateGauge();
    const diff=Math.abs(gameState.ovenTemp-TARGET_TEMP);
    if(diff<=PERFECT_RANGE){
        clearInterval(ovenDecayInterval);
        document.getElementById('smashBtn').disabled=true;
        document.getElementById('ovenFeedback').textContent='🎊 완벽한 온도!';
        showToast('완벽해요! 180°C 달성! 🔥');
        setTimeout(showResult,1500);
    } else if(gameState.ovenTemp>TARGET_TEMP+PERFECT_RANGE){
        document.getElementById('ovenFeedback').textContent='🌡️ 너무 뜨거워요! 식혀요...';
    } else {
        document.getElementById('ovenFeedback').textContent='🔥 계속 가열하세요!';
    }
}

function updateGauge() {
    const pct=(gameState.ovenTemp/MAX_TEMP)*100;
    document.getElementById('gaugeFill').style.width=pct+'%';
    document.getElementById('ovenTemp').textContent=
        `${Math.round(gameState.ovenTemp)}°C / 목표: ${TARGET_TEMP}°C`;
    const ratio=gameState.ovenTemp/MAX_TEMP;
    document.getElementById('ovenDisplay').style.filter=
        `hue-rotate(${ratio*-60}deg) brightness(${1+ratio*0.4})`;
}

// ===== 화면 4 =====
function showResult() {
    clearInterval(gameState.timerInterval);
    goToScreen(4);
    const s=gameState.score;
    let stars='⭐⭐⭐', title='완벽한 빵이야!! 🎉', sub='최고의 빵을 구웠어요!';
    if(s<TOTAL_HITS){ stars='⭐⭐'; title='꽤 괜찮은 빵이야! 😊'; sub='조금만 더 연습하면 완벽해요!'; }
    document.getElementById('resultStars').textContent=stars;
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultSubtitle').textContent=sub;
    spawnSparkles();
}

function spawnSparkles() {
    const emojis=['✨','⭐','🌟','💫'];
    for(let i=0;i<16;i++){
        setTimeout(()=>{
            const sp=document.createElement('div');
            sp.className='sparkle';
            sp.textContent=emojis[Math.floor(Math.random()*emojis.length)];
            sp.style.left=Math.random()*90+5+'%';
            sp.style.top =Math.random()*70+10+'%';
            document.body.appendChild(sp);
            setTimeout(()=>sp.remove(),1000);
        },i*110);
    }
}

function restartGame() {
    gameState={
        screen:1,
        ingredients:{flour:false,salt:false,sugar:false,water:false,yeast:false},
        score:0, ovenTemp:0, timerSec:0, timerInterval:null,
    };
    ['flour','salt','sugar','water','yeast'].forEach(t=>{
        document.getElementById(`ing-${t}`).classList.remove('added');
    });
    ['r-flour','r-salt','r-sugar','r-water','r-yeast'].forEach(id=>{
        document.getElementById(id).classList.remove('done');
    });
    document.getElementById('nextBtn1').classList.remove('visible');
    document.getElementById('timer1').textContent='00:00';
    goToScreen(1);
    startTimer('timer1');
}
</script>
